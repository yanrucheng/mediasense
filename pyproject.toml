[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mediasense"
version = "0.8.0"
description = "Local-first, agent-native media organization with auditable stages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.25,<5",
  "gpxpy>=1.6,<2",
  "mcp>=2.1,<3",
  "Pillow>=11,<13",
]

[project.scripts]
mediasense = "mediasense.cli:main"

[project.optional-dependencies]
embeddings = [
  "torch>=2.6,<3",
  "transformers>=4.26,<5",
]
local-models = [
  "nudenet==3.4.2",
  "torch>=2.1,<3",
  "transformers>=4.26,<5",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mediasense"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not local_fixture and not scale'"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "characterization: behavior captured from the AI Album production baseline",
  "local_fixture: opt-in tests that require a fixture outside the repository",
  "scale: opt-in generated scale and throughput acceptance tests",
]
